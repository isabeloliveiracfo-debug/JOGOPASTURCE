  @media (prefers-reduced-motion: reduce){
    .screen.active{animation:none;}
  }

  #idleRotator{font-size:3.2vw; min-height:12vh; max-width:80vw; opacity:0.85; transition:opacity 0.6s;}
  #idle .cta{

    background:var(--gold); padding:2.5vh 6vw; border-radius:100px;
    animation:bounce 1.8s infinite;
  }
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-15px);}}

  @keyframes qEntra{
    from{opacity:0; transform:translateX(28px);}

  if(timerInterval){

/* =========================================================
   ÁUDIO — música de fundo e efeitos sonoros (Web Audio API)
   ========================================================= */
let audioCtx = null;
let musicaTimer = null;

function iniciarAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === 'suspended'){
    audioCtx.resume();
  }
}

function tocarNota(freq, duracao, tipo, volume, quando){
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = tipo;
  osc.frequency.value = freq;
  const inicio = audioCtx.currentTime + quando;
  gain.gain.setValueAtTime(0.0001, inicio);
  gain.gain.exponentialRampToValueAtTime(volume, inicio + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, inicio + duracao);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(inicio);
  osc.stop(inicio + duracao + 0.05);
}

const MELODIA_FUNDO = [523.25, 659.25, 783.99, 659.25, 523.25, 659.25, 783.99, 1046.50];
const BAIXO_FUNDO = [130.81, 130.81, 164.81, 164.81];

function agendarLoopMusica(){
  if(!audioCtx) return;
  const tempoNota = 0.3;
  MELODIA_FUNDO.forEach((freq, i) => tocarNota(freq, tempoNota * 0.85, 'square', 0.045, i * tempoNota));
  const duracaoTotal = MELODIA_FUNDO.length * tempoNota;
  BAIXO_FUNDO.forEach((freq, i) => tocarNota(freq, (duracaoTotal / BAIXO_FUNDO.length) * 0.9, 'triangle', 0.06, i * (duracaoTotal / BAIXO_FUNDO.length)));
  musicaTimer = setTimeout(agendarLoopMusica, duracaoTotal * 1000);
}

function iniciarMusica(){
  iniciarAudio();
  if(musicaTimer) return;
  agendarLoopMusica();
}

function pararMusica(){
  if(musicaTimer){
    clearTimeout(musicaTimer);
    musicaTimer = null;
  }
}

function tocarAcerto(){
  iniciarAudio();
  [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => tocarNota(f, 0.2, 'square', 0.09, i * 0.09));
}

function tocarErro(){
  iniciarAudio();
  tocarNota(196.00, 0.4, 'sawtooth', 0.08, 0);
  tocarNota(146.83, 0.45, 'sawtooth', 0.08, 0.08);
}

function tocarTique(){
  iniciarAudio();
  tocarNota(880, 0.09, 'square', 0.05, 0);
}

function mostrarTela(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  el(id).classList.add('active');
}

function embaralhar(array){
  const a = [...array];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function iniciarIdle(){
  limparTimers();
  pararMusica();
  mostrarTela('idle');
  rotacionarFrasesIdle();
}

let idleFraseIndex = 0;
function rotacionarFrasesIdle(){
  const rotator = el('idleRotator');
  rotator.style.opacity = 0;
  setTimeout(() => {
    rotator.textContent = CONFIG.frasesIdle[idleFraseIndex % CONFIG.frasesIdle.length];
    rotator.style.opacity = 0.85;
    idleFraseIndex++;
  }, 400);
  const t = setTimeout(rotacionarFrasesIdle, 4500);
  timers.push(t);
}

function iniciarJogo(){
  limparTimers();
  iniciarMusica();
  perguntasEmbaralhadas = embaralhar(CONFIG.perguntas).slice(0, CONFIG.perguntasPorRodada);
  indiceAtual = 0;
  acertos = 0;
  mostrarPergunta();
}

function mostrarPergunta(){
  limparTimers();
  const p = perguntasEmbaralhadas[indiceAtual];
  el('progressText').textContent = `Pergunta ${indiceAtual + 1} de ${perguntasEmbaralhadas.length}`;
  el('charadaText').textContent = p.charada;

  const container = el('opcoesContainer');
  container.innerHTML = '';
  const opcoesEmbaralhadas = p.opcoes.map((texto, idx) => ({texto, correta: idx === p.correta}));
  embaralhar(opcoesEmbaralhadas).forEach(op => {
    const btn = document.createElement('button');
    btn.className = 'opcaoBtn';
    btn.textContent = op.texto;
    btn.onclick = () => responder(op.correta, btn, container);
    container.appendChild(btn);
  });

  mostrarTela('question');
  iniciarTemporizador(container);
}

function iniciarTemporizador(container){
  let restante = CONFIG.tempoPorPergunta;
  const fill = el('timerFill');
  const num = el('timerNum');

  num.textContent = restante;
  num.classList.remove('urgente');
  fill.classList.remove('urgente');
  fill.style.animation = 'none';
  void fill.offsetWidth;
  fill.style.animation = `timerShrink ${CONFIG.tempoPorPergunta}s linear forwards`;

  timerInterval = setInterval(() => {
    restante--;
    num.textContent = Math.max(restante, 0);
    if(restante <= 3 && restante > 0){
      num.classList.add('urgente');
      fill.classList.add('urgente');
      tocarTique();
    }
    if(restante <= 0){
      clearInterval(timerInterval);
      timerInterval = null;
      responder(false, null, container, true);
    }
  }, 1000);
}

function responder(correta, btnClicado, container, esgotado){
  limparTimers();
  container.querySelectorAll('.opcaoBtn').forEach(b => b.onclick = null);
  const p = perguntasEmbaralhadas[indiceAtual];

  if(correta) acertos++;
  if(btnClicado) btnClicado.classList.add(correta ? 'correta' : 'errada');

  if(correta){
    tocarAcerto();
  } else {
    tocarErro();
  }

  const t1 = setTimeout(() => {
    el('resultadoText').textContent = correta ? 'Você acertou! 🎉' : (esgotado ? 'Tempo esgotado! ⏰' : 'Quase lá!');
    el('feedback').classList.remove('acertou', 'errou');
    el('feedback').classList.add(correta ? 'acertou' : 'errou');
    el('respostaText').textContent = 'Resposta: ' + p.opcoes[p.correta];
    el('curiosidadeText').textContent = p.curiosidade;
    mostrarTela('feedback');

    const t2 = setTimeout(() => {
      indiceAtual++;
      if(indiceAtual < perguntasEmbaralhadas.length){
        mostrarPergunta();
      } else {
        mostrarFinal();
      }
    }, CONFIG.feedbackDuration * 1000);
    timers.push(t2);
  }, 700);
  timers.push(t1);
}

function mostrarFinal(){
  limparTimers();
  pararMusica();
  el('placarText').textContent = `${acertos} / ${perguntasEmbaralhadas.length}`;
  el('scanPrompt').textContent = CONFIG.scanPrompt;
  el('instaHandle').textContent = CONFIG.instagramHandle;
  el('brindeText').textContent = CONFIG.brindeMensagem;
  el('qrImg').src = CONFIG.qrImagePath;

  const barra = el('barraFinal');
  barra.style.animation = 'none';
  void barra.offsetWidth;
  barra.style.animation = `shrink ${CONFIG.finalScreenDuration}s linear forwards`;

  mostrarTela('final');

  const t = setTimeout(iniciarIdle, CONFIG.finalScreenDuration * 1000);
  timers.push(t);
}

/* Aplica textos de marca configuráveis */
el('brandName').textContent = CONFIG.brandName;
el('brandSubtitle').textContent = CONFIG.brandSubtitle;

/* Início: tocar em qualquer lugar da tela idle começa o jogo */
el('idle').addEventListener('click', iniciarJogo);
el('idle').addEventListener('touchstart', iniciarJogo);

iniciarIdle();
</script>
